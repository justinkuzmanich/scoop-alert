name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  # Also deploy after the daily scrape commits new deals.json. The scrape pushes
  # with the built-in GITHUB_TOKEN, and GitHub deliberately does NOT let such
  # pushes trigger other workflows (recursion guard) — so without this the site
  # would only redeploy on a manual/human push and go stale between scrapes.
  workflow_run:
    workflows: ["Refresh deals (daily)"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
