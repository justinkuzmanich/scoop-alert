name: Refresh deals (daily)

# Fetches the current Safeway weekly ad via Flipp and commits an updated
# public/data/deals.json. Pushing to main re-triggers deploy.yml, so the live
# site always reflects the latest scrape.
#
# Email alerts go out via Resend when the RESEND_API_KEY secret is set. With no
# key, scraper/notify.js falls back to harmless console output, so the refresh
# still works before email is configured. "Newly on sale" is diffed against the
# previously committed deals.json, so a normal run never re-emails old deals.

on:
  schedule:
    # Daily at 14:00 UTC (~7am PT). Safeway's ad is weekly, but a daily run
    # cheaply catches the mid-week rollover without depending on a fixed day.
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Send a one-time test alert email instead of scraping'
        type: boolean
        default: false

# Allow the job to commit the refreshed deals.json back to the repo.
permissions:
  contents: write

# Don't overlap a scheduled run with a manual one.
concurrency:
  group: refresh-deals
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: Scrape latest deals
        run: npm run scrape
        env:
          # Set RESEND_API_KEY under Settings → Secrets and variables → Actions
          # (Secrets) to enable real emails. ALERT_FROM / ALERT_TO are optional
          # repo Variables; ALERT_TO falls back to the owner's address below.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM: ${{ vars.ALERT_FROM || 'Scoop Alert <onboarding@resend.dev>' }}
          ALERT_TO: ${{ vars.ALERT_TO || 'justin.kuzmanich@gmail.com' }}
          # When the manual "test_email" toggle is on, send one sample alert
          # (no scrape, deals.json untouched) to verify Resend delivery.
          TEST_ALERT: ${{ inputs.test_email && '1' || '' }}
          # Optional: Safeway "for U" personalized deals. When SAFEWAY_SESSION
          # (the logged-in Cookie header) is set, the scraper folds in member +
          # coupon prices; absent/expired, it silently falls back to Flipp.
          SAFEWAY_SESSION: ${{ secrets.SAFEWAY_SESSION }}
          SAFEWAY_SUB_KEY: ${{ secrets.SAFEWAY_SUB_KEY }}
          # Residential proxy so J4U requests don't originate from the (Imperva-
          # blocked) GitHub Actions IP range. Unset → requests go out direct.
          J4U_PROXY_URL: ${{ secrets.J4U_PROXY_URL }}
      - name: Commit updated deals.json if changed
        run: |
          if git diff --quiet -- public/data/deals.json; then
            echo "No deal changes — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/deals.json
          git commit -m "chore: refresh deals.json (daily scrape)"
          git push
